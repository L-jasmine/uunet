[package]
name = "uunet"
version = "0.1.0"
edition = "2024"
description = "uunet — 扫码登录 + 端口映射的终端组网工具(TUI)"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
hmac = "0.12"
prost = "0.14"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
ratatui = "0.30"
ratatui-kit = "0.12"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "gzip",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
kcp = { path = "vendor/kcp" }
webrtc = { path = "vendor/webrtc" }

[patch.crates-io]
dtls = { path = "vendor/dtls" }
interceptor = { path = "vendor/interceptor" }
rtcp = { path = "vendor/rtcp" }
turn = { path = "vendor/turn" }
webrtc-ice = { path = "vendor/webrtc-ice" }
webrtc-sctp = { path = "vendor/webrtc-sctp" }
webrtc-srtp = { path = "vendor/webrtc-srtp" }
webrtc-util = { path = "vendor/webrtc-util" }

[profile.release]
strip = true
